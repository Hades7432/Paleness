name: Paleness Visual Test Lab
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/paleness-0.5-overhaul', 'feature/paleness-0.5.1-polish', 'feature/paleness-0.5.2-portal-rework', 'feature/paleness-0.6-souls-alloy']
    paths:
      - 'src/main/**'
      - 'ci/**'
      - 'tools/prepare_visual_assets.py'
      - 'tools/validate_assets.py'
      - 'tools/review_visual_lab.py'
      - 'tools/render_texture_sheet.py'
      - '.github/workflows/visual-lab.yml'
      - 'build.gradle'
concurrency:
  group: paleness-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  minecraft-client:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Restore approved visual resources
        run: python tools/prepare_visual_assets.py
      - name: Validate all art references before Minecraft
        run: python tools/validate_assets.py
      - name: Build Paleness with real textures
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/generate_index.py
          python tools/check_portal_animation.py
          gradle --no-daemon build
      - name: Create pixel-art review sheet
        run: python tools/render_texture_sheet.py
      - name: Stage Paleness in NeoForge
        run: |
          mkdir -p run/mods
          cp build/libs/paleness-*.jar run/mods/
      - name: Capture Minecraft using software OpenGL
        id: capture
        timeout-minutes: 7
        uses: headlesshq/mc-runtime-test@5.0.0
        with:
          mc: '1.21.1'
          modloader: neoforge
          java: '21'
          mc-runtime-test: neoforge
          dummy-assets: 'false'
          xvfb: 'true'
          cache-mc: github
          headlessmc-command: '--jvm "-Djava.awt.headless=true -Dpaleness.visualTest=true -DMcRuntimeGameTestMinExpectedGameTests=1"'
      - name: Detect missing models and inspect screenshots
        if: always() && steps.capture.outcome != 'skipped'
        run: python tools/review_visual_lab.py
      - name: Preserve QA diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Paleness-visual-lab-${{ github.run_number }}
          path: |
            run/screenshots/paleness-*.png
            run/logs/latest.log
            run/visual-review.md
            run/visual-review.json
            run/crash-reports/
            build/paleness-assets-check.json
          retention-days: 21
          if-no-files-found: warn

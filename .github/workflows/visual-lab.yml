name: Paleness Visual Test Lab
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/main/**'
      - 'ci/**'
      - 'tools/prepare_visual_assets.py'
      - 'tools/review_visual_lab.py'
      - '.github/workflows/visual-lab.yml'
      - 'build.gradle'
jobs:
  minecraft-client:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Restore approved artistic resources
        run: python tools/prepare_visual_assets.py
      - name: Build Paleness with real textures
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/generate_index.py
          gradle --no-daemon build
      - name: Stage Paleness in NeoForge
        run: |
          mkdir -p run/mods
          cp build/libs/paleness-*.jar run/mods/
      - name: Launch real Minecraft with software OpenGL and native assets
        uses: headlesshq/mc-runtime-test@5.0.0
        with:
          mc: '1.21.1'
          modloader: neoforge
          java: '21'
          mc-runtime-test: neoforge
          dummy-assets: 'false'
          xvfb: 'true'
          cache-mc: github
          headlessmc-command: '--jvm "-Djava.awt.headless=true -Dpaleness.visualTest=true -DMcRuntimeGameTestMinExpectedGameTests=1"'
      - name: Analyze screenshot and missing-model warnings
        if: always()
        run: python tools/review_visual_lab.py
      - name: Preserve screenshots, QA reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Paleness-visual-lab-${{ github.run_number }}
          path: |
            run/screenshots/paleness-*.png
            run/logs/latest.log
            run/visual-review.md
            run/crash-reports/
          retention-days: 14
          if-no-files-found: warn

name: Build Paleness
on:
  push:
    branches: [main, 'feature/paleness-0.5-overhaul', 'feature/paleness-0.5.1-polish', 'feature/paleness-0.5.2-portal-rework']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Restore approved art (no missing-texture JAR releases)
        run: python tools/prepare_visual_assets.py
      - name: Validate approved art before release
        run: python tools/validate_assets.py
      - name: Generate canonical vanilla Paleness values
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/generate_index.py
      - name: Build mod
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: paleness-0.5.2-alpha
          path: build/libs/*.jar
          if-no-files-found: error

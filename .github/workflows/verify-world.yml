name: Verify Paleness world
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/paleness-0.5-overhaul', 'feature/paleness-0.5.1-polish', 'feature/paleness-0.5.2-portal-rework']
jobs:
  world-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Generate texture-based values
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/generate_index.py
      - name: Verify portal animation loop
        run: python tools/check_portal_animation.py
      - name: Launch Minecraft GameTest server
        timeout-minutes: 7
        run: gradle --no-daemon runGameTestServer

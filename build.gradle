plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = mod_group_id
version = mod_version
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer { type = 'gameTestServer' }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { paleness { sourceSet sourceSets.main } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

sourceSets.main.resources.srcDir('src/generated/resources')


// Keep the approved Paleness 0.6 art reproducible even for direct Gradle builds.
// The ZIP is SHA256-locked; images are written to src/main/resources before packaging.
tasks.register('installApprovedAssets06', Exec) {
    commandLine 'python3', 'tools/unpack_approved_06_assets.py'
}
tasks.named('processResources') {
    dependsOn tasks.named('installApprovedAssets06')
}
